[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "ETL pipeline for the Shell Asset Atlas: pulls public regulator and open data, normalises it, and writes web-ready GeoJSON + production series."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atlas-build = "atlas.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
