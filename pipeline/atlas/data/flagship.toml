# Curated flagship sites outside the three regulator datasets.
#
# This is the only hand-maintained file in the pipeline. Everything else comes straight
# from public regulator / open data. Keep entries conservative:
#   * coordinates are approximate site locations (±1–2 km), good for a globe, not for navigation
#   * stake: operated | jv | partner  (as publicly reported; equity changes, so check as_of)
#   * wikidata: a QID for the item when one exists. The site panel links to it.
# Divested sites (e.g. Bukom/Singapore refinery, Deer Park, Mobile) are deliberately excluded.

