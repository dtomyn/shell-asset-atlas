name: Refresh data & deploy

on:
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      offline:
        description: "Build from committed snapshots only (skip fetching)"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

# Least privilege: every job starts read-only and asks for exactly what it needs. The build
# job runs third-party code (npm/uv installs, PR changes), so it never holds a write token.
permissions:
  contents: read

concurrency:
  group: atlas-${{ github.ref }}
  # Superseded PR builds are cancelled; a run on main (e.g. the weekly refresh) always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to commit SHAs (the comment names the tag); Dependabot
# (.github/dependabot.yml) keeps the pins current.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Pipeline unit tests
        working-directory: pipeline
        run: uv run --locked --extra dev pytest -q

      # Scheduled / manual runs pull fresh data from every publisher. Pushes and PRs rebuild
      # from the committed snapshots so they are fast and deterministic.
      - name: Build data bundle
        working-directory: pipeline
        env:
          ATLAS_CACHE_TTL: "0"
          FETCH_LIVE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.offline) }}
        run: |
          if [[ "$FETCH_LIVE" == "true" ]]; then
            uv run --locked atlas-build
          else
            uv run --locked atlas-build --offline
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      # The refreshed data is handed to the commit job, which is the only one that can push.
      - name: Save refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refreshed-data
          path: |
            pipeline/snapshots
            web/public/data
          retention-days: 7

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  commit:
    # Runs only after the data and the site have both built, so a broken refresh is never pushed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: refreshed-data
          path: refreshed

      - name: Commit refreshed snapshots
        run: |
          rm -rf pipeline/snapshots web/public/data
          cp -r refreshed/pipeline/snapshots pipeline/snapshots
          cp -r refreshed/web/public/data web/public/data
          rm -rf refreshed
          git config user.name "atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline/snapshots web/public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
