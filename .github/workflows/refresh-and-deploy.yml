name: Refresh data & deploy

on:
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      offline:
        description: "Build from committed snapshots only (skip fetching)"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/pyproject.toml

      - name: Pipeline unit tests
        working-directory: pipeline
        run: uv run --extra dev pytest -q

      # Scheduled / manual runs pull fresh data from every publisher. Pushes and PRs rebuild
      # from the committed snapshots so they are fast and deterministic.
      - name: Build data bundle
        working-directory: pipeline
        env:
          ATLAS_CACHE_TTL: "0"
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || ( "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.offline }}" != "true" ) ]]; then
            uv run atlas-build
          else
            uv run atlas-build --offline
          fi

      - name: Commit refreshed snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/snapshots web/public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
